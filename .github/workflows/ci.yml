name: CI
on: [push]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install dependencies
        run: corepack yarn install

      - name: Build packages
        run: corepack yarn run build

      - name: Run ESLint
        run: corepack yarn run lint
